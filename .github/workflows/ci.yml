name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Same script the pre-push hook runs, so local and CI cannot disagree.
      # No .env is written on purpose: the whole gate must pass without one, which
      # is what a fresh clone gets. If a future task needs a database, add a
      # postgres service here rather than weakening this.
      - run: pnpm verify
